# Compose project dompetku di VM DB. Dipasang di /opt/dompetku/compose.yml.
# S1: gw + placeholder (dihapus akhir S1) + postgres sementara (diganti image sendiri di S2).
name: dompetku

services:
  gw:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    ports:
      # Satu-satunya port host DompetKu. Dibatasi ke 10.0.0.149 oleh dompetku-firewall.service.
      - '10.0.1.68:8443:8443'
      - '10.0.1.68:9443:9443'
    volumes:
      - ./gw/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pki/gw:/pki:ro
    tmpfs:
      - /data
      - /config
    networks: [app]
    read_only: true
    cap_drop: [ALL]
    # Binary caddy di image resmi punya file capability ini; tanpanya exec ditolak.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100

  placeholder:
    # Hanya untuk verifikasi header S1 (rute /_s1/headers). Dihapus di langkah terakhir S1.
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    restart: unless-stopped
    networks: [app]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 32m
    cpus: 0.1

  postgres:
    # Sementara untuk membuktikan "tanpa port host". S2 menggantinya dengan Postgres 17 + WAL-G + pgaudit
    # dan menginisialisasi ulang volume (belum ada data).
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    env_file: ./env/postgres.env
    environment:
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    shm_size: 128m
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # gw <-> web (web butuh egress untuk Resend dan harga saham).
  app: {}
  # web/worker <-> postgres, tanpa akses keluar dan tanpa port host.
  internal:
    internal: true

volumes:
  pgdata: {}
