name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tipe rute (typedRoutes) dibuat dulu supaya lint dan typecheck melihat tipe yang sama dengan build.
      - run: pnpm --filter @dompetku/web exec next typegen
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:registry
      - run: pnpm build
      # Bundel worker berdiri sendiri: validasi env contoh tanpa koneksi DB.
      - name: Worker --check-config
        env:
          DATABASE_URL: postgres://dompetku_worker@db:5432/dompetku?sslmode=verify-full
        run: node apps/worker/dist/worker.mjs --check-config

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
        env:
          CI: 'true'
          HOME: /root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action membaca daftar commit PR pada event pull_request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -no-color
      # Online audit (impostor commit, versi tag) memakai token baca bawaan.
      - uses: docker://ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 # 1.31.1
        with:
          args: --format plain --min-severity low .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6 # 1.182.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Semgrep OSS, aturan registry publik, tanpa akun dan tanpa metrik.
      - run: >-
          semgrep scan --error --metrics off
          --config p/default --config p/typescript --config p/react --config p/nextjs
          --config p/dockerfile --config p/github-actions

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck bawaan image runner; semua skrip bash di infra/.
      - run: |
          mapfile -t scripts < <(grep -rlE '^#!/usr/bin/env bash|^#!/bin/(ba)?sh' infra)
          shellcheck --severity=warning "${scripts[@]}"
      - run: bash infra/db-vm/deploy/test/deploy-test.sh
      - run: bash infra/db-vm/bin/test/dompetku-psql-test.sh

  db:
    # pgTAP (TRD §5 butir 1, BSD §13): role BSD, dbmate up, pg_prove sebagai dompetku_test (bukan
    # superuser), lalu semua migrasi selain 0001 di-rollback dan diterapkan ulang: skema harus
    # identik dan tes tetap hijau. Cluster sekali pakai tanpa port host; semua lewat docker exec.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Image dasar yang sama dengan image VM (infra/db-vm/postgres/Dockerfile); digest = indeks
        # multi-arch, jadi runner amd64 memakai varian amd64 dari rilis 17.11 yang sama.
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          # Tanpa password: cluster CI sekali pakai, tidak dipublikasikan ke host.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Sama dengan service migrate di infra/db-vm/compose.yml.
      DBMATE_IMAGE: ghcr.io/amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Container Postgres
        env:
          PG_ID: ${{ job.services.postgres.id }}
        run: echo "PG=$PG_ID" >> "$GITHUB_ENV"
      - name: Pasang pgTAP dan pg_prove (PGDG/Debian, versi dipatok)
        # pgTAP sama dengan image VM (runbook S2: 1.3.4). PGDG hanya menyimpan versi terbaru:
        # bila 1.3.4 hilang dari repo, naikkan pin ini bersama image VM.
        run: |
          docker exec "$PG" sh -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              "postgresql-17-pgtap=1.3.4-*" "libtap-parser-sourcehandler-pgtap-perl=3.36-*" >/dev/null
            dpkg-query -W postgresql-17-pgtap libtap-parser-sourcehandler-pgtap-perl
            psql -U postgres -Atc "select version()"'
      - name: Role BSD dan salin berkas DB
        run: |
          docker cp packages/db "$PG:/db"
          docker exec "$PG" psql -U postgres -v ON_ERROR_STOP=1 -q -d postgres -f /db/roles/00_roles.sql
      - name: dbmate up
        run: |
          docker run --rm --network "container:$PG" -v "$GITHUB_WORKSPACE/packages/db/migrations:/db/migrations:ro" \
            -e DATABASE_URL='postgres://dompetku_owner@127.0.0.1:5432/dompetku?sslmode=disable' \
            -e DBMATE_MIGRATIONS_DIR=/db/migrations -e DBMATE_NO_DUMP_SCHEMA=true \
            "$DBMATE_IMAGE" --wait up
      - name: pg_prove
        run: |
          docker exec "$PG" psql -U postgres -v ON_ERROR_STOP=1 -q -d dompetku -f /db/tests/support/setup.sql
          # Dump pembanding diambil sesudah setup.sql agar ekstensi pgtap ada di kedua dump.
          docker exec "$PG" pg_dump -U postgres -s -N tap -N tests dompetku \
            | grep -v '^\\\(un\)\?restrict' >"$RUNNER_TEMP/schema-1.sql"
          docker exec "$PG" sh -c 'pg_prove -U dompetku_test -d dompetku /db/tests/*.sql'
      - name: dbmate rollback semua lalu up lagi
        run: |
          dbmate() {
            docker run --rm --network "container:$PG" -v "$GITHUB_WORKSPACE/packages/db/migrations:/db/migrations:ro" \
              -e DATABASE_URL='postgres://dompetku_owner@127.0.0.1:5432/dompetku?sslmode=disable' \
              -e DBMATE_MIGRATIONS_DIR=/db/migrations -e DBMATE_NO_DUMP_SCHEMA=true \
              "$DBMATE_IMAGE" "$@"
          }
          setenv() {
            docker exec "$PG" psql -U postgres -d dompetku -v ON_ERROR_STOP=1 -qc \
              "update app.settings set value = '$1' where key = 'env'"
          }
          # Blok down ditolak selama env = prod (bawaan 0001, nilai di VM).
          if dbmate rollback; then echo "rollback lolos padahal env = prod"; exit 1; fi
          # 0001 maju-saja (blok down kosong); semua migrasi sesudahnya wajib bisa di-rollback.
          setenv dev
          n=$(($(find packages/db/migrations -name '*.sql' | wc -l) - 1))
          for _ in $(seq "$n"); do dbmate rollback; done
          left=$(docker exec "$PG" psql -U postgres -d dompetku -Atc \
            "select count(*) from pg_class c join pg_namespace s on s.oid = c.relnamespace
             where s.nspname in ('app','api','private','jobs','audit','auth') and c.relkind in ('r','v','m')")
          test "$left" = 1 || { echo "sisa relasi setelah rollback: $left (harus hanya app.settings)"; exit 1; }
          dbmate up
          setenv prod
          docker exec "$PG" pg_dump -U postgres -s -N tap -N tests dompetku \
            | grep -v '^\\\(un\)\?restrict' >"$RUNNER_TEMP/schema-2.sql"
          diff -u "$RUNNER_TEMP/schema-1.sql" "$RUNNER_TEMP/schema-2.sql"
          docker exec "$PG" sh -c 'pg_prove -U dompetku_test -d dompetku /db/tests/*.sql'

  auth:
    # Tes integrasi worker dan auth (Vitest, Better Auth + Postgres sungguhan) dan e2e alur auth mode nyata
    # (Playwright, autentikator passkey virtual). Cluster sekali pakai dengan image dan migrasi
    # yang sama dengan job db; port hanya untuk runner ini.
    runs-on: ubuntu-latest
    # e2e:ledger S6 + S7 (axe tiga lebar x dua tema) menambah beberapa menit.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DBMATE_IMAGE: ghcr.io/amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Role BSD dan dbmate up
        env:
          PG_ID: ${{ job.services.postgres.id }}
        run: |
          docker cp packages/db/roles/00_roles.sql "$PG_ID:/roles.sql"
          docker exec "$PG_ID" psql -U postgres -v ON_ERROR_STOP=1 -q -d postgres -f /roles.sql
          docker run --rm --network "container:$PG_ID" -v "$GITHUB_WORKSPACE/packages/db/migrations:/db/migrations:ro" \
            -e DATABASE_URL='postgres://dompetku_owner@127.0.0.1:5432/dompetku?sslmode=disable' \
            -e DBMATE_MIGRATIONS_DIR=/db/migrations -e DBMATE_NO_DUMP_SCHEMA=true \
            "$DBMATE_IMAGE" --wait up
      # Worker (apps/worker) sebelum tes web supaya DB masih bersih: runJob terhadap jobs.* sebagai
      # dompetku_worker, pg-boss di skema pgboss (createSchema: false), stub Healthchecks lokal.
      - name: Tes integrasi worker
        env:
          TEST_WORKER_DATABASE_URL: postgres://dompetku_worker@127.0.0.1:5432/dompetku
          TEST_DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:5432/dompetku
        run: pnpm --filter @dompetku/worker test:int
      - name: Tes integrasi auth
        env:
          TEST_DATABASE_URL: postgres://dompetku_web@127.0.0.1:5432/dompetku
          TEST_DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:5432/dompetku
        run: pnpm --filter @dompetku/web test:int
      - run: pnpm build
      - run: pnpm --filter @dompetku/web exec playwright install --with-deps chromium
      - name: E2E auth mode nyata
        env:
          CI: 'true'
          AUTH_E2E_DATABASE_URL: postgres://dompetku_web@127.0.0.1:5432/dompetku
          AUTH_E2E_ADMIN_URL: postgres://postgres@127.0.0.1:5432/dompetku
        run: pnpm --filter @dompetku/web e2e:auth
      - name: E2E ledger mode nyata
        env:
          CI: 'true'
          AUTH_E2E_DATABASE_URL: postgres://dompetku_web@127.0.0.1:5432/dompetku
          AUTH_E2E_ADMIN_URL: postgres://postgres@127.0.0.1:5432/dompetku
        run: pnpm --filter @dompetku/web e2e:ledger
      - name: E2E bersama dua user (Novanda + Farida)
        env:
          CI: 'true'
          AUTH_E2E_DATABASE_URL: postgres://dompetku_web@127.0.0.1:5432/dompetku
          AUTH_E2E_ADMIN_URL: postgres://postgres@127.0.0.1:5432/dompetku
        run: pnpm --filter @dompetku/web e2e:bersama
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-auth
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ledger
          path: apps/web/playwright-report-ledger
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-bersama
          path: apps/web/playwright-report-bersama
          retention-days: 7
          if-no-files-found: ignore

  image:
    # Dockerfile tetap bisa dibangun dan lolos Trivy sebelum merge; tanpa push.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          build-args: BUILD_SHA=${{ github.sha }}
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - name: Trivy (HIGH/CRITICAL yang sudah ada perbaikannya)
        env:
          TAR_DIR: ${{ runner.temp }}
        run: >-
          docker run --rm -v "$TAR_DIR:/scan:ro"
          ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --input /scan/image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --scanners vuln --no-progress
