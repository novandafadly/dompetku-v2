# Compose project dompetku di VM DB. Dipasang di /opt/dompetku/compose.yml.
# S1: gw. S2: postgres (image sendiri) + migrate (dbmate, profil tools). S3: web (profil web).
# S7: worker (profil web, image sama dengan web). WA: openwa (profil web, image pihak ketiga) dan
# wa-proxy (profil web, Caddy, satu-satunya jalur antara openwa dan web).
name: dompetku

services:
  gw:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    ports:
      # Satu-satunya port host DompetKu. Dibatasi ke 10.0.0.149 oleh dompetku-firewall.service.
      - '10.0.1.68:8443:8443'
      - '10.0.1.68:9443:9443'
    volumes:
      - ./gw/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pki/gw:/pki:ro
    tmpfs:
      - /data
      - /config
    networks: [app]
    read_only: true
    cap_drop: [ALL]
    # Binary caddy di image resmi punya file capability ini; tanpanya exec ditolak.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100

  postgres:
    # Postgres 17 + pgaudit + pgTAP + WAL-G (infra/db-vm/postgres). Tanpa port host.
    build: ./postgres
    image: dompetku-postgres:17.11-1
    restart: unless-stopped
    command: ['postgres', '-c', 'config_file=/etc/dompetku/postgresql.conf']
    env_file:
      - ./env/postgres.env
      - ./env/backup.env
    environment:
      POSTGRES_INITDB_ARGS: '--data-checksums --auth-local=peer --auth-host=scram-sha-256'
      PGHOST: /var/run/postgresql
      PGUSER: postgres
      WALG_PREVENT_WAL_OVERWRITE: 'true'
      WALG_COMPRESSION_METHOD: zstd
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pki/postgres:/etc/dompetku/tls:ro
    # internal: klien aplikasi web/migrate (pg_hba subnet ini). worker_db: hanya worker (S7, pg_hba
    # subnet sendiri). egress: hanya untuk WAL-G ke bucket OCI.
    networks: [internal, worker_db, egress]
    shm_size: 128m
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      # Sebagai user OS postgres: pg_hba memakai peer, root akan memenuhi log dengan FATAL.
      test: ['CMD', 'gosu', 'postgres', 'pg_isready', '-q']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    # Dijalankan manual/deployer: docker compose run --rm migrate up
    image: ghcr.io/amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb
    profiles: [tools]
    env_file: ./env/migrate.env
    environment:
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_NO_DUMP_SCHEMA: 'true'
      # Tanpa PGOPTIONS pgaudit.log: parameter superuser; memberi owner hak itu = owner bisa mematikan auditnya.
    volumes:
      - ./migrations:/migrations:ro
      - ./pki/postgres/ca.crt:/etc/dompetku/ca.crt:ro
    networks: [internal]
    depends_on: [postgres]

  web:
    # S3. Tidak pernah ditarik compose: /opt/dompetku/bin/deploy memverifikasi digest GHCR lalu
    # memberi tag lokal dompetku-web:current (rollback = tag ulang). Profil web agar
    # `docker compose up -d` tidak gagal sebelum deploy pertama; deployer memakai --profile web.
    image: dompetku-web:current
    pull_policy: never
    profiles: [web]
    restart: unless-stopped
    env_file:
      - path: ./env/web.env
        required: false
    # app: dari gw dan keluar (Resend, harga). internal: ke postgres (mulai S4). wa_web: hanya ke
    # wa-proxy (OPENWA_URL=http://wa-proxy:2786, hanya kirim teks) dan dari wa-proxy (webhook). Web
    # tidak berbagi network dengan openwa. Alamat dipatok: wa-proxy hanya menerima :2786 dari alamat
    # ini. wa_web selalu ada (tanpa wa-proxy pun web jalan normal; fitur WA saja yang tidak sampai).
    networks:
      app: {}
      internal: {}
      wa_web:
        ipv4_address: 172.16.28.3
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # S4: CA DompetKu untuk DATABASE_URL sslmode=verify-full (docs/ops/auth.md).
    volumes:
      - ./pki/postgres/ca.crt:/etc/dompetku/ca.crt:ro
    user: '65532:65532'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  worker:
    # S7 (K1). Image yang sama dengan web (tag lokal dari deployer, rollback bersama web); entri
    # /app/worker/worker.mjs (pg-boss, job terjadwal WIB). Deployer mengganti worker sesudah web sehat
    # dan melewatinya selama env/worker.env belum ada (docs/ops/runbook-s7-worker.md). required:
    # false agar berkas yang belum ada tidak menggagalkan compose untuk web dan migrate.
    image: dompetku-web:current
    pull_policy: never
    profiles: [web]
    restart: unless-stopped
    command: ['worker/worker.mjs']
    env_file:
      - path: ./env/worker.env
        required: false
    # worker_db: ke postgres saja (pg_hba: dompetku_worker hanya dari subnet ini). worker_egress:
    # egress untuk Healthchecks (tidak difilter). Worker tidak berbagi network dengan gw/web: worker
    # yang disusupi tidak bisa memanggil web:3000 langsung (melewati gw, memalsukan X-Forwarded-For).
    networks: [worker_db, worker_egress]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # CA DompetKu untuk DATABASE_URL sslmode=verify-full (sama dengan web).
    volumes:
      - ./pki/postgres/ca.crt:/etc/dompetku/ca.crt:ro
    user: '65532:65532'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    # SIGTERM -> pg-boss stop graceful (job aktif diselesaikan, batas STOP_TIMEOUT_MS 30 s di
    # apps/worker/src/worker.ts) + pool.end sebelum SIGKILL; harus > 30 s (dijaga worker.test.ts).
    stop_grace_period: 45s
    # Tanpa HTTP: HEALTHCHECK image (milik web, port 3000) dimatikan. Health = deployer
    # (running + RestartCount stabil 20 detik).
    healthcheck:
      disable: true

  openwa:
    # Catat via WhatsApp (spec 2026-11-09 §5.1, docs/ops/runbook-wa.md). OpenWA 0.29.1 (rilis
    # 2026-11-07), indeks multi-arch (linux/amd64 + linux/arm64) diikat digest; naik versi = ganti tag
    # dan digest bersamaan lewat PR. Bukan bagian rilis web: deployer memasangnya bersama wa-proxy
    # sesudah web sehat, tidak pernah menggagalkan atau me-rollback web karena openwa, dan
    # melewatinya selama env/openwa.env belum ada (required: false agar compose untuk web dan
    # migrate tetap jalan).
    image: ghcr.io/rmyndharis/openwa:0.29.1@sha256:5d4e2d71d3802e6cd66ac92ff3543f2eb391d20e7db711e8641c5127644a817a
    profiles: [web]
    restart: unless-stopped
    env_file:
      - path: ./env/openwa.env
        required: false
    # Nilai non-rahasia yang menentukan keamanan/kebenaran dipatok di sini (menang atas env_file),
    # supaya openwa.env yang tidak lengkap tidak diam-diam memakai bawaan lain. Rahasia di openwa.env.
    environment:
      NODE_ENV: production
      PORT: '2785'
      # Tanpa Chromium (whatsapp-web.js bawaan); SQLite di /app/data (DATABASE_NAME sengaja tidak
      # diisi: nilainya menjadi path berkas SQLite dan di rootfs read-only membuat boot-loop).
      ENGINE_TYPE: baileys
      DATABASE_TYPE: sqlite
      # Pengirim @lid mendapat senderPhone; tanpa ini nomor @lid tidak pernah bisa dihubungkan.
      RESOLVE_LID_TO_PHONE: 'true'
      # Bawaan production = sesi tidak dinyalakan saat boot: tanpa ini restart/recreate container
      # (deploy, reboot VM) memutus bot sampai POST /start manual.
      AUTO_START_SESSIONS: 'true'
      MAX_CONCURRENT_SESSIONS: '1'
      # Webhook ke http://wa-proxy:8081 = alamat privat, ditolak guard SSRF kecuali host ini diizinkan
      # (dipatok ke alamat hasil resolve saat webhook didaftarkan). Guard tetap aktif untuk tujuan lain.
      WEBHOOK_SSRF_PROTECT: 'true'
      SSRF_ALLOWED_HOSTS: wa-proxy
      # Handler web menunggu sendText (batas 10 s) sebelum menjawab; bawaan 10000 ms memotongnya dan
      # memicu kirim ulang (aman karena idempoten, tapi balasan ganda tertunda). Harus > 10 s.
      WEBHOOK_TIMEOUT: '20000'
      # Teks pesan (nominal, keterangan) tersimpan di SQLite OpenWA; bawaan 0 = selamanya.
      MESSAGE_RETENTION_DAYS: '7'
      # Tanpa panggilan ke api.github.com; Swagger tidak disajikan (skema + versi tanpa API key).
      UPDATE_CHECK_ENABLED: 'false'
      ENABLE_SWAGGER: 'false'
      # Dasbor hanya dibuka lewat tunnel SSH ke http://localhost (runbook); tanpa ini layar putih.
      CSP_UPGRADE_INSECURE_REQUESTS: 'false'
    # wa: hanya openwa + wa-proxy (REST masuk dari wa-proxy, webhook keluar ke wa-proxy:8081).
    # wa_egress: keluar ke server WhatsApp (tidak difilter per host). Sengaja tidak ikut
    # app/internal/wa_web/worker_db/egress/worker_egress:
    # openwa yang disusupi tidak menjangkau web, postgres, gw, atau worker. Alamat di wa dipatok:
    # wa-proxy hanya menerima :8081 dari alamat ini.
    networks:
      wa:
        ipv4_address: 172.16.26.3
      wa_egress: {}
    # Tanpa port host: dasbor/Swagger tidak dipublikasikan. Pemasangan nomor = kode pairing lewat
    # `docker compose exec` (tanpa port), cadangan QR = override sementara 127.0.0.1 (runbook-wa).
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Sesi WhatsApp (kredensial Baileys = kunci akun bot), SQLite, kunci admin. Hanya openwa.
    volumes:
      - openwa_data:/app/data
    # User openwa image (uid/gid 997). Dengan user non-root entrypoint melewati chown + gosu, jadi
    # tanpa cap_add. Volume baru diisi salinan /app/data image (milik 997) saat pertama dipasang.
    user: '997:997'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    # Urutan stop OpenWA sampai 33 s (+ webhook drain); bawaan compose upstream 75 s.
    stop_grace_period: 75s
    # Sama dengan HEALTHCHECK image (curl ada di image), ditulis eksplisit agar terlihat.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  wa-proxy:
    # Satu-satunya jalur openwa <-> web (spec 2026-11-09 §6, runbook-wa). Allowlist L7: openwa hanya
    # bisa POST /api/wa/webhook ke web (header identitas klien dibuang), web hanya bisa POST
    # send-text ke openwa. Image dan pengerasan sama dengan gw. Dikelola deployer bersama openwa
    # (dilewati selama env/openwa.env belum ada, tidak pernah ikut rollback web).
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    profiles: [web]
    restart: unless-stopped
    volumes:
      - ./wa-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config
    # Alamat dipatok: Caddyfile mengikat :8081 hanya ke alamat di wa dan :2786 hanya ke alamat di
    # wa_web, lalu memeriksa alamat sumber (openwa .3 di wa, web .3 di wa_web). allowedIps key web
    # di OpenWA = 172.16.26.2/32 (request web sampai ke OpenWA dengan alamat sumber wa-proxy).
    networks:
      wa:
        ipv4_address: 172.16.26.2
      wa_web:
        ipv4_address: 172.16.28.2
    read_only: true
    # Tanpa root: port di atas 1024. NET_BIND_SERVICE tetap di bounding set hanya karena binary caddy
    # di image resmi punya file capability itu (tanpanya exec ditolak, sama dengan gw); dengan user
    # non-root + no-new-privileges capability itu tidak pernah aktif.
    user: '65532:65532'
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50

networks:
  # gw <-> web (web butuh egress untuk Resend dan harga saham).
  app: {}
  # web/migrate <-> postgres, tanpa akses keluar dan tanpa port host. Subnet dipatok untuk pg_hba.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/16
  # worker <-> postgres saja (S7), tanpa akses keluar. Subnet dipatok untuk pg_hba, sengaja di luar
  # pool bawaan Docker (172.17-31.0.0/16, 192.168.0.0/16): network tanpa subnet dipatok (app, egress,
  # worker_egress, project lain di VM) mengambil dari pool itu dan bisa menabrak subnet dipatok.
  worker_db:
    internal: true
    ipam:
      config:
        - subnet: 172.16.25.0/24
  # Hanya postgres: keluar ke OCI Object Storage untuk WAL-G.
  egress: {}
  # Hanya worker: egress untuk ping Healthchecks.io (tidak difilter). Terpisah dari app (gw/web) dan
  # egress (postgres).
  worker_egress: {}
  # openwa <-> wa-proxy saja (Catat via WhatsApp), tanpa akses keluar. Subnet dipatok di luar pool
  # bawaan Docker (alasan sama dengan worker_db); .2 wa-proxy dan .3 openwa dipatok di layanan,
  # alokasi dinamis (container lain yang keliru ikut) hanya dari ip_range, tidak pernah .2/.3.
  wa:
    internal: true
    ipam:
      config:
        - subnet: 172.16.26.0/24
          ip_range: 172.16.26.128/25
  # wa-proxy <-> web saja, tanpa akses keluar. .2 wa-proxy, .3 web (dipatok di layanan).
  wa_web:
    internal: true
    ipam:
      config:
        - subnet: 172.16.28.0/24
          ip_range: 172.16.28.128/25
  # Hanya openwa: keluar ke server WhatsApp. Tidak difilter per host (server WhatsApp tidak punya
  # daftar host stabil); terpisah dari app (gw/web), egress (postgres), worker_egress (worker).
  wa_egress: {}

volumes:
  pgdata: {}
  # Sesi WhatsApp + SQLite OpenWA. Siapa pun yang membaca volume ini bisa memakai akun bot.
  openwa_data: {}
