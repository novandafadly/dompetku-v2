# Edge DompetKu di VM App. Dipasang di /etc/nginx/sites-available/dompetku (symlink ke sites-enabled).
# Meneruskan ke gw (VM DB) lewat mTLS. Pola sama dengan tanya-hpp, CA terpisah.

server {
    listen 80;
    listen [::]:80;
    server_name dompet.novandafadly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dompet.novandafadly.com;

    ssl_certificate /etc/letsencrypt/live/dompet.novandafadly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dompet.novandafadly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass https://10.0.1.68:8443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Header forward ditulis ulang di sini; nilai dari klien tidak pernah diteruskan.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Middleware-Subrequest "";

        proxy_ssl_certificate         /etc/nginx/dompetku-pki/edge.crt;
        proxy_ssl_certificate_key     /etc/nginx/dompetku-pki/edge.key;
        proxy_ssl_trusted_certificate /etc/nginx/dompetku-pki/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name dompetku-gw.internal;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
