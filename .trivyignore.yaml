    purls:
      - pkg:deb/debian/libzstd1
    expired_at: 2026-12-09
    statement: 'libzstd1 1.5.7+dfsg-1 di image dasar distroless nodejs24-debian13; tambalan Debian 1.5.7+dfsg-1+deb13u1 belum masuk build distroless terbaru (sha256:39b04073…, diperiksa 2026-11-25). Tidak bisa di-apt di distroless; aplikasi tidak memanggil libzstd1 langsung. Dicabut segera setelah distroless memuat +deb13u1 (maks 14 hari). Delegasi pemilik ("best practices"/"lanjut sampai selesai"); keputusan terbuka untuk dicabut.'
