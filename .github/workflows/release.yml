name: Release

# Hanya push ke main: image arm64 web -> GHCR by digest -> Trivy -> SBOM -> tanda tangan cosign
# (kunci milik pemilik, tanpa log transparansi publik) -> tag main.
# Deployer VM (infra/db-vm/deploy) menarik digest tag main dan memverifikasi tanda tangan + SBOM.
on:
  push:
    branches: [main]

permissions: {}

# Rilis berurutan; deployer tetap menolak digest dengan commit lebih tua.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/novandafadly/dompetku-web

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push image, tanda tangan, dan attestation cosign ke GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Waktu commit (UTC) untuk label created
        id: meta
        run: echo "created=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tahap build berjalan native amd64; image runtime arm64 tanpa RUN, jadi tanpa QEMU.
      - name: Build dan push (tanpa tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          build-args: BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Trivy (gagal bila HIGH/CRITICAL yang sudah ada perbaikannya)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD
          -v "$GITHUB_WORKSPACE/.trivyignore.yaml:/trivyignore.yaml:ro"
          ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --platform linux/arm64 --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /trivyignore.yaml --scanners vuln --no-progress "$REF"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-release-assets: false

      - name: Pasang cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # Kunci pribadi milik pemilik (secret repo), bukan keyless: artifact attestation GitHub tidak
      # tersedia untuk repo private akun pribadi, dan keyless menulis entri publik ke Rekor.
      # Signing config tanpa layanan = tanpa Fulcio, Rekor, dan TSA (pengganti --tlog-upload=false
      # yang di cosign v3 ditolak bersama signing config bawaan).
      - name: Tanda tangan digest dan attest SBOM (cosign, tanpa log transparansi)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          SBOM: ${{ runner.temp }}/sbom.spdx.json
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo '::error::Secret COSIGN_PRIVATE_KEY/COSIGN_PASSWORD belum diisi; image tidak ditandatangani dan tag main tidak dipindah. Lihat infra/db-vm/deploy/README.md bagian Tanda tangan image.'
            exit 1
          fi
          sc="$RUNNER_TEMP/signing-config.json"
          echo '{"mediaType":"application/vnd.dev.sigstore.signingconfig.v0.2+json"}' > "$sc"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --signing-config "$sc" "$REF"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --signing-config "$sc" \
            --type spdxjson --predicate "$SBOM" "$REF"

      # Tag dipasang terakhir: deployer hanya melihat digest yang sudah lolos scan dan ditandatangani.
      - name: Tag main dan sha
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            -t "$IMAGE:main" -t "$IMAGE:sha-$SHA" "$IMAGE@$DIGEST"
          resolved=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest}}' | jq -r .digest)
          test "$resolved" = "$DIGEST"
          echo "### $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.spdx.json
          retention-days: 90
