# Konfigurasi Postgres DompetKu (menggantikan postgresql.conf bawaan; config_file=/etc/dompetku/postgresql.conf).
# Nilai skema dari BSD §12. Batas container: 1 GiB RAM, 1 CPU.

listen_addresses = '*'           # hanya network Docker internal; tanpa port host
port = 5432
max_connections = 40
hba_file = '/etc/dompetku/pg_hba.conf'

shared_buffers = 256MB
effective_cache_size = 640MB
work_mem = 4MB
maintenance_work_mem = 64MB

password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/dompetku/tls/postgres.crt'
ssl_key_file = '/etc/dompetku/tls/postgres.key'
ssl_min_protocol_version = 'TLSv1.3'

timezone = 'UTC'
log_timezone = 'UTC'
default_transaction_isolation = 'read committed'

# WAL dan backup (RPO <= 5 menit). WAL-G membaca kredensial dari env container (backup.env).
wal_level = replica
archive_mode = on
archive_command = 'wal-g wal-push %p'
archive_timeout = 300
max_wal_size = 512MB

# Log dan audit (BSD §12). Log ke stderr = log container.
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'ddl'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
# terse: tanpa DETAIL/HINT/CONTEXT di log server. DETAIL 23505 memuat nilai kunci (mis. nama dompet
# di accounts_name_unique) dan 23514/23502 memuat "Failing row contains (...)" berisi deskripsi dan
# nominal. Klien tetap menerima DETAIL utuh (pemetaan galat web tidak berubah).
log_error_verbosity = terse
log_connections = on
log_disconnections = on
shared_preload_libraries = 'pgaudit'
pgaudit.role = 'dompetku_auditlog'
pgaudit.log_parameter = off
