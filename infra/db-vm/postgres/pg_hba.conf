# Postgres DompetKu. Superuser hanya lewat socket di dalam container (peer).
# Role aplikasi hanya lewat TLS dari network dompetku_internal (172.24.0.0/16, dipatok di compose).
# dompetku_worker hanya dari network dompetku_worker_db (172.25.0.0/16, berisi postgres + worker).
# TYPE   DATABASE  USER                                                     ADDRESS        METHOD
local    all       postgres                                                                peer
local    all       all                                                                     reject
hostssl  dompetku  dompetku_owner,dompetku_web,dompetku_monitor             172.24.0.0/16  scram-sha-256
hostssl  dompetku  dompetku_worker                                          172.25.0.0/16  scram-sha-256
host     all       all                                                      0.0.0.0/0      reject
host     all       all                                                      ::/0           reject
