# Pengecualian Trivy untuk image OpenWA (workflow openwa-image.yml). Terpisah dari .trivyignore.yaml
# (image web): CVE image pihak ketiga tidak bisa kita tambal sendiri; perbaikannya = naik versi.
# Setiap entri wajib: id, purls, expired_at <= 30 hari, statement (alasan + persetujuan pemilik).
# Sesudah expired_at entri gugur dan CVE kembali menggagalkan pemindaian. docs/ops/ci-keamanan.md.
vulnerabilities:
  - id: CVE-2026-76024
    purls:
      - pkg:deb/debian/chromium
      - pkg:deb/debian/chromium-common
      - pkg:deb/debian/chromium-sandbox
    expired_at: 2026-11-21
    statement: 'Paket chromium Debian di image OpenWA 0.27.1 arm64 (156.0.8078.73, perbaikan .79); hanya dipakai engine whatsapp-web.js yang tidak dipakai. Compose mematok ENGINE_TYPE=baileys (dijaga langkah workflow, env compose menang atas dasbor), jadi Chromium tidak pernah diluncurkan. Kontainer uid 997, read_only, cap_drop ALL, no-new-privileges, tanpa port masuk, egress disaring. Dicabut paling lambat 2026-11-21; naik ke 0.29.1 sesudah 2026-11-14 18:52 WIB (rencana bump). Persetujuan: disetujui pemilik lewat delegasi 2026-11-10 ("kerjain aja best practices dan terbaik dari sisi keamanan"); keputusan terbuka untuk dicabut.'
